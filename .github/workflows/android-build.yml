# scripts/build_android.ps1 phai XANH o day truoc khi dua owner (CTO 27/10/2026): Windows PowerShell 5.1 nhu may owner.
# Ky bang keystore TAM tao trong CI (khong phai khoa that; file .aab cua CI KHONG dung de tai len Play).
name: android-build

on:
  push:
    paths:
      - 'scripts/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build-windows-ps51:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Cu phap moi .ps1 trong scripts/ (Windows PowerShell 5.1)
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'Khong phai Windows PowerShell 5.1' }
          $bad = 0
          Get-ChildItem -Path scripts -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null; $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errs) | Out-Null
            if ($errs) { $bad++; foreach ($e in $errs) { Write-Host ('LOI ' + $_.Name + ':' + $e.Extent.StartLineNumber + ' ' + $e.Message) } }
            else { Write-Host ('OK  ' + $_.FullName) }
            $raw = [System.IO.File]::ReadAllBytes($_.FullName)
            if (($raw | Where-Object { $_ -gt 127 }).Count -and -not ($raw[0] -eq 0xEF -and $raw[1] -eq 0xBB -and $raw[2] -eq 0xBF)) { $bad++; Write-Host ('LOI ' + $_.Name + ': ky tu ngoai ASCII ma khong co BOM') }
          }
          if ($bad) { exit 1 }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Keystore TAM + key.properties
        run: |
          & keytool -genkeypair -v -keystore android\app\ci-temp.jks -alias ci -keyalg RSA -keysize 2048 -validity 1 -storepass ci-pass-123 -keypass ci-pass-123 -dname 'CN=CI TaiwanMate'
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Set-Content -Path android\key.properties -Encoding ascii -Value @('storePassword=ci-pass-123', 'keyPassword=ci-pass-123', 'keyAlias=ci', 'storeFile=ci-temp.jks')

      - name: Phai DUNG khi versionCode khong lon hon Play (truoc khi build)
        run: |
          $code = [int](Select-String -Path pubspec.yaml -Pattern '^version:\s*\S+\+(\d+)').Matches[0].Groups[1].Value
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build_android.ps1 -PlayVersionCode $code
          if ($LASTEXITCODE -eq 0) { throw 'Script phai dung khi versionCode <= Play' }
          Write-Host 'OK: dung dung luc'

      - name: Phai DUNG khi api_constants tro vao localhost
        run: |
          $f = 'lib\core\constants\api_constants.dart'
          $orig = [System.IO.File]::ReadAllText($f)
          [System.IO.File]::WriteAllText($f, $orig.Replace('https://taiwanmate-backend-production.up.railway.app', 'http://localhost:8000'))
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build_android.ps1 -PlayVersionCode 0
          $rc = $LASTEXITCODE
          [System.IO.File]::WriteAllText($f, $orig)
          if ($rc -eq 0) { throw 'Script phai dung khi baseUrl la localhost' }
          Write-Host 'OK: dung dung luc'

      - name: build_android.ps1 (versionCode tren Play nhap qua stdin)
        shell: cmd
        run: |
          (echo 0) | powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build_android.ps1
          if %ERRORLEVEL% NEQ 0 exit /b 1

      - name: Kiem tra file .aab
        run: |
          $aab = 'build\app\outputs\bundle\release\app-release.aab'
          if (-not (Test-Path $aab)) { throw 'Khong co file .aab' }
          Get-Item $aab | Format-List Name, Length
          git diff --exit-code -- lib
