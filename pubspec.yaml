name: chinesemate
description: ChineseMate AI - Learn Chinese with AI
publish_to: 'none'
version: 1.0.0+46

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5
  go_router: ^17.3.0
  dio: ^5.9.2
  http: ^1.2.0
  audioplayers: ^6.1.0
  record: ^7.0.0
  path_provider: ^2.1.4
  characters: ^1.3.0
  flutter_secure_storage: ^10.3.1
  flutter_open_chinese_convert: ^0.9.0
  stroke_order_animator: ^3.3.1
  hanzi_writer_data_flutter: ^0.0.1
  shared_preferences: ^2.2.3
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  image_picker: ^1.1.2
  in_app_purchase: ^3.3.0 
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  gap: ^3.0.1
  intl: ^0.19.0
  uuid: ^4.4.0
  url_launcher: ^6.3.0
  lottie: ^3.1.0
  web_socket_channel: ^3.0.1
  cupertino_icons: ^1.0.2
  share_plus: ^13.2.0
  in_app_review: ^2.0.8
  image: ^4.2.0
  google_mlkit_text_recognition: ^0.15.0
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: NotoSansTC
      fonts:
       - asset: assets/fonts/NotoSansTC-Regular.ttf

dependency_overrides:
  record_web: 2.1.1