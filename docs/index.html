<!DOCTYPE html>
<html lang="vi">
<head>
  <base href="/taiwanmate-app/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="ChineseMate AI - Learn Chinese with AI. Dịch thuật, Chat AI, Flashcard thông minh.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ChineseMate">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#F5A623">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>ChineseMate AI - Learn Chinese with AI</title>

  <!-- Preload các file nặng nhất — tải song song ngay từ đầu -->
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preload" href="assets/fonts/MaterialIcons-Regular.otf" as="font" crossorigin>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #06060F;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.7s ease;
      overflow: hidden;
    }

    #canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #splash-bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 30% 20%, rgba(245,166,35,0.08) 0%, transparent 50%),
                  radial-gradient(ellipse at 70% 80%, rgba(255,200,80,0.06) 0%, transparent 50%),
                  radial-gradient(ellipse at 50% 50%, rgba(10,5,30,1) 0%, #06060F 100%);
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
    }
    .orb-1 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(245,166,35,0.12) 0%, transparent 70%);
      top: -100px; right: -100px;
      animation: orbFloat 8s ease-in-out infinite;
    }
    .orb-2 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(255,213,79,0.08) 0%, transparent 70%);
      bottom: -50px; left: -50px;
      animation: orbFloat 10s ease-in-out infinite reverse;
    }

    #content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #logo-ring {
      position: relative;
      width: 120px;
      height: 120px;
      margin-bottom: 28px;
      animation: fadeInUp 0.8s ease forwards;
    }

    #logo-ring::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #F5A623, #FFD54F, #FFF8E1, #F5A623);
      animation: spin 3s linear infinite;
      mask: radial-gradient(farthest-side, transparent calc(100% - 3px), white calc(100% - 3px));
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), white calc(100% - 3px));
    }

    #logo-inner {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: linear-gradient(135deg, #1A1008 0%, #0D0D20 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        inset 0 1px 0 rgba(245,166,35,0.2),
        0 0 40px rgba(245,166,35,0.15),
        0 20px 60px rgba(0,0,0,0.5);
    }

    #logo-emoji {
      font-size: 52px;
      filter: drop-shadow(0 0 12px rgba(245,166,35,0.6));
    }

    .dot {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #F5A623;
      box-shadow: 0 0 8px rgba(245,166,35,0.8);
    }

    #logo-text {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      animation: fadeInUp 0.8s ease 0.15s both;
    }

    #logo-text .white { color: white; }
    #logo-text .gold {
      background: linear-gradient(135deg, #F5A623 0%, #FFD54F 50%, #F5A623 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      background-size: 200% 100%;
      animation: goldShimmer 3s ease-in-out infinite;
    }

    #logo-sub {
      font-size: 14px;
      color: rgba(255,255,255,0.4);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 40px;
      animation: fadeInUp 0.8s ease 0.3s both;
    }

    #flags {
      display: flex;
      gap: 10px;
      margin-bottom: 44px;
      animation: fadeInUp 0.8s ease 0.45s both;
    }

    .flag-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      color: rgba(255,255,255,0.55);
      font-size: 12px;
      backdrop-filter: blur(10px);
      transition: all 0.3s;
    }

    #progress-wrap {
      width: 180px;
      animation: fadeInUp 0.8s ease 0.6s both;
    }

    #progress-track {
      width: 100%;
      height: 2px;
      background: rgba(255,255,255,0.06);
      border-radius: 2px;
      overflow: hidden;
    }

    #progress-bar {
      height: 100%;
      width: 30%;
      background: linear-gradient(90deg, transparent, #F5A623, #FFD54F, transparent);
      border-radius: 2px;
      animation: scanline 1.8s ease-in-out infinite;
    }

    #progress-text {
      text-align: center;
      color: rgba(245,166,35,0.4);
      font-size: 10px;
      margin-top: 10px;
      letter-spacing: 2px;
    }

    @keyframes orbFloat {
      0%, 100% { transform: translate(0,0) scale(1); }
      50% { transform: translate(20px,-30px) scale(1.05); }
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes goldShimmer {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    @keyframes scanline {
      0% { transform: translateX(-200%); }
      100% { transform: translateX(500%); }
    }

    #legal-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      text-align: center;
      padding: 8px 12px;
      font-size: 11px;
      color: rgba(255,255,255,0.35);
      background: rgba(6,6,15,0.85);
      z-index: 10001;
      backdrop-filter: blur(8px);
    }
    #legal-footer a {
      color: rgba(245,166,35,0.7);
      text-decoration: none;
      margin: 0 6px;
    }
    #legal-footer a:hover { color: #F5A623; }
  </style>

 
</head>
<body>
  <div id="splash">
    <div id="splash-bg"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <canvas id="canvas"></canvas>
    <div id="content">
      <div id="logo-ring">
        <div id="logo-inner">
          <div id="logo-emoji">🌏</div>
        </div>
      </div>
      <div id="logo-text">
        <span class="white">Chinese</span><span class="gold">Mate</span><span class="white"> AI</span>
      </div>
      <div id="logo-sub">Learn · Speak · Thrive</div>
      <div id="flags">
        <div class="flag-item">🇻🇳 Việt</div>
        <div class="flag-item">🇹🇼 中文</div>
        <div class="flag-item">🇺🇸 English</div>
      </div>
      <div id="progress-wrap">
        <div id="progress-track">
          <div id="progress-bar"></div>
        </div>
        <div id="progress-text">LOADING</div>
      </div>
    </div>
  </div>

  <script>
    // Particle system — dừng khi Flutter load xong
    var canvas = document.getElementById('canvas');
    var ctx = canvas.getContext('2d');
    var particles = [];
    var shapes = [];
    var W, H;
    var animRunning = true;
    var animId = null;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    for (var i = 0; i < 80; i++) {
      particles.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        r: Math.random() * 1.5 + 0.3,
        vx: (Math.random() - 0.5) * 0.3,
        vy: (Math.random() - 0.5) * 0.3,
        alpha: Math.random() * 0.5 + 0.1,
        gold: Math.random() > 0.6
      });
    }

    for (var j = 0; j < 12; j++) {
      shapes.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        size: Math.random() * 40 + 10,
        rotation: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 0.005,
        alpha: Math.random() * 0.04 + 0.01,
        sides: [3, 4, 6][Math.floor(Math.random() * 3)],
        vx: (Math.random() - 0.5) * 0.15,
        vy: (Math.random() - 0.5) * 0.15,
      });
    }

    function drawPolygon(ctx, x, y, sides, size, rotation) {
      ctx.beginPath();
      for (var i = 0; i < sides; i++) {
        var angle = rotation + (i * Math.PI * 2) / sides;
        var px = x + Math.cos(angle) * size;
        var py = y + Math.sin(angle) * size;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
    }

    function animate() {
      if (!animRunning) return; // DỪNG khi Flutter load xong
      animId = requestAnimationFrame(animate);
      ctx.clearRect(0, 0, W, H);

      shapes.forEach(function(s) {
        s.rotation += s.vr;
        s.x += s.vx; s.y += s.vy;
        if (s.x < -100) s.x = W + 100;
        if (s.x > W + 100) s.x = -100;
        if (s.y < -100) s.y = H + 100;
        if (s.y > H + 100) s.y = -100;
        ctx.save();
        ctx.globalAlpha = s.alpha;
        ctx.strokeStyle = 'rgba(245,166,35,0.6)';
        ctx.lineWidth = 0.5;
        drawPolygon(ctx, s.x, s.y, s.sides, s.size, s.rotation);
        ctx.stroke();
        ctx.restore();
      });

      particles.forEach(function(p, i) {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
        if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.gold ? '#F5A623' : 'rgba(255,255,255,0.8)';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        for (var j = i + 1; j < particles.length; j++) {
          var dx = p.x - particles[j].x;
          var dy = p.y - particles[j].y;
          var dist = Math.sqrt(dx*dx + dy*dy);
          if (dist < 100) {
            ctx.save();
            ctx.globalAlpha = (1 - dist/100) * 0.08;
            ctx.strokeStyle = p.gold ? '#F5A623' : 'rgba(255,255,255,0.5)';
            ctx.lineWidth = 0.5;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.stroke();
            ctx.restore();
          }
        }
      });
    }
    animate();

    // Hide splash + DỪNG animation khi Flutter load xong
    window.addEventListener('flutter-first-frame', function() {
      animRunning = false; // Dừng particle animation — giải phóng CPU
      if (animId) cancelAnimationFrame(animId);

      var splash = document.getElementById('splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(function() { splash.style.display = 'none'; }, 700);
      }
      var legalFooter = document.getElementById('legal-footer');
      if (legalFooter) legalFooter.style.display = 'none';
    });

    // iOS Add to Home Screen
    var isIOS = /iphone|ipad|ipod/.test(navigator.userAgent.toLowerCase());
    var isStandalone = ('standalone' in navigator) && navigator.standalone;
    if (isIOS && !isStandalone) {
      setTimeout(function() {
        var b = document.createElement('div');
        b.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(10,8,20,0.96);color:white;padding:14px 22px;border-radius:18px;font-family:-apple-system,sans-serif;font-size:13px;text-align:center;z-index:10000;max-width:300px;backdrop-filter:blur(20px);border:1px solid rgba(245,166,35,0.25);box-shadow:0 8px 32px rgba(0,0,0,0.5),0 0 0 1px rgba(245,166,35,0.1)';
        b.innerHTML = '<strong style="color:#F5A623">📱 Thêm vào màn hình chính</strong><br><small style="opacity:0.55;margin-top:5px;display:block">Nhấn ⬆️ Share → Add to Home Screen</small>';
        b.onclick = function() { b.remove(); };
        document.body.appendChild(b);
        setTimeout(function() { if (b.parentNode) b.remove(); }, 9000);
      }, 3500);
    }

    // Service Worker — cache để tải nhanh từ lần 2 trở đi
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('flutter_service_worker.js?v=5').catch(function(){});
      });

      // Tự reload khi service worker cập nhật
      navigator.serviceWorker.addEventListener('controllerchange', function() {
        window.location.reload();
      });

      // Kiểm tra update mỗi 5 phút
      setInterval(function() {
        navigator.serviceWorker.getRegistration().then(function(reg) {
          if (reg) reg.update();
        });
      }, 5 * 60 * 1000);
    }

    document.addEventListener('touchmove', function(e) {
      if (e.target === document.body) e.preventDefault();
    }, { passive: false });
  </script>

  <div id="legal-footer">
    <a href="terms.html">Điều khoản</a> ·
    <a href="privacy.html">Bảo mật</a> ·
    <a href="refund.html">Hoàn tiền</a>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
